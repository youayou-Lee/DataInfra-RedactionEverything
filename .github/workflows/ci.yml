name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基底守卫（Issue #62 评审教训：功能分支误基于旧 main 会悄悄回退
  # preview 已验收改动）。落后 preview 的分支直接红灯，不靠人眼抓。
  base-guard:
    name: Base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request 事件默认检出 refs/pull/N/merge（head×base 合并提交），
          # 它天然包含 origin/preview，ancestor 检查会恒真放行——必须检出 head 本体
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Feature branches must target preview and include it
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"
          echo "PR base: $BASE, head: $HEAD_REF"
          if [ -z "$BASE" ]; then
            echo "push/workflow_dispatch 触发，跳过守卫"
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            # main 只收晋级（head=preview）与 hotfix（事故教训：PR #58 曾误选
            # base=main 把功能直接合进 main），其余目标 main 的 PR 一律拒绝
            if [ "$HEAD_REF" = "preview" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
              echo "main 晋级/hotfix PR：放行"
              exit 0
            fi
            echo "::error::目标 main 的 PR 只允许 preview 晋级或 hotfix/* 分支（当前 head=$HEAD_REF）。功能分支应以 preview 为 base"
            exit 1
          fi
          if [ "$BASE" != "preview" ]; then
            echo "::error::功能分支必须以 preview 为 base（当前 base=$BASE）"
            exit 1
          fi
          git fetch origin preview --quiet
          if git merge-base --is-ancestor origin/preview HEAD; then
            echo "OK：分支已包含最新 preview"
          else
            echo "::error::分支落后 preview：先执行 git merge origin/preview 再推送（防止合并时回退 preview 已验收改动）"
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  backend:
    name: Backend import and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check app/

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        run: python -m pytest tests -q

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t test-backend -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t test-frontend -f frontend/Dockerfile frontend/
