name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基底守卫（Issue #62 评审教训：功能分支误基于旧 main 会悄悄回退
  # preview 已验收改动）。落后 preview 的分支直接红灯，不靠人眼抓。
  base-guard:
    name: Base guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Feature branches must target preview and include it
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          echo "PR base: $BASE"
          if [ -z "$BASE" ]; then
            echo "push/workflow_dispatch 触发，跳过守卫"
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            echo "main 同步/发布类 PR：跳过 ancestor 检查"
            exit 0
          fi
          if [ "$BASE" != "preview" ]; then
            echo "::error::功能分支必须以 preview 为 base（当前 base=$BASE）"
            exit 1
          fi
          git fetch origin preview --quiet
          if git merge-base --is-ancestor origin/preview HEAD; then
            echo "OK：分支已包含最新 preview"
          else
            echo "::error::分支落后 preview：先执行 git merge origin/preview 再推送（防止合并时回退 preview 已验收改动）"
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  backend:
    name: Backend import and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check app/

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        run: python -m pytest tests -q

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t test-backend -f backend/Dockerfile backend/

      - name: Build frontend image
        run: docker build -t test-frontend -f frontend/Dockerfile frontend/
